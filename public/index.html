<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kairn — Agent Safety Firewall</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; font: 16px system-ui, sans-serif; background: #0f1117; color: #edf0f7; }
      h1 { letter-spacing: .08em; } textarea { width: 100%; min-height: 220px; box-sizing: border-box; padding: 16px; background: #191d27; color: inherit; border: 1px solid #394052; border-radius: 10px; font: 14px monospace; }
      button { margin-top: 14px; padding: 12px 18px; border: 0; border-radius: 8px; background: #b8f36b; color: #111; font-weight: 700; cursor: pointer; } pre { white-space: pre-wrap; background: #191d27; padding: 16px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <h1>KAIRN</h1>
    <p>Inspect an agent action before it touches a tool, wallet, or user data.</p>
    <textarea id="action">{
  "action": "pay_service",
  "amount": 85,
  "currency": "USDC",
  "recipient": "0xservice",
  "requestedData": ["customer_email_list"],
  "policy": { "maxPayment": 10 }
}</textarea>
    <button id="evaluate">Evaluate action</button>
    <pre id="result">Decision will appear here.</pre>
    <script>
      document.querySelector('#evaluate').onclick = async () => {
        const result = document.querySelector('#result');
        try {
          const response = await fetch('/api/evaluate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: document.querySelector('#action').value });
          result.textContent = JSON.stringify(await response.json(), null, 2);
        } catch (error) { result.textContent = error.message; }
      };
    </script>
  </body>
</html>
